<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inscription - Mamadou Siradjo Baldé</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-gray-100 font-sans">

    <!-- MENU -->
    <nav class="max-w-[1000px] mx-auto mt-5 bg-[#123f63] rounded-xl px-6 py-4">
        <div class="flex flex-wrap justify-center gap-6">

            <a href="../index.html"
               class="text-white font-semibold hover:text-blue-200 transition">
                Accueil
            </a>

            <a href="projets.html"
               class="text-white font-semibold hover:text-blue-200 transition">
                Projets
            </a>

            <a href="contact.html"
               class="text-white font-semibold hover:text-blue-200 transition">
                Contact
            </a>

            <a href="connexion.html"
               class="text-white font-semibold hover:text-blue-200 transition">
                Connexion
            </a>

            <a href="inscription.html"
               class="text-white font-semibold hover:text-blue-200 transition">
                Inscription
            </a>

        </div>
    </nav>


    <!-- CONTENU -->
    <main class="max-w-[500px] mx-auto px-5 py-12">

        <div class="bg-white rounded-2xl shadow-lg p-8">

            <!-- TITRE -->
            <div class="text-center mb-8">

                <h1 class="text-3xl font-bold text-[#123f63]">
                    Créer un compte
                </h1>

                <p class="text-gray-500 mt-2">
                    Inscrivez-vous pour accéder à votre espace.
                </p>

            </div>


            <!-- FORMULAIRE -->
            <form action="../backend/inscription.php"
                  method="POST"
                  class="space-y-5">

                <!-- NOM -->
                <div>
                    <label for="nom"
                           class="block text-sm font-semibold text-gray-700 mb-2">
                        Nom complet
                    </label>

                    <input
                        type="text"
                        id="nom"
                        name="nom"
                        placeholder="Entrez votre nom"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg
                               focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>


                <!-- EMAIL -->
                <div>
                    <label for="email"
                           class="block text-sm font-semibold text-gray-700 mb-2">
                        Adresse email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="exemple@gmail.com"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg
                               focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>


                <!-- MOT DE PASSE -->
                <div>
                    <label for="password"
                           class="block text-sm font-semibold text-gray-700 mb-2">
                        Mot de passe
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Entrez votre mot de passe"
                        required
                        minlength="6"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg
                               focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>


                <!-- CONFIRMATION -->
                <div>
                    <label for="confirmation"
                           class="block text-sm font-semibold text-gray-700 mb-2">
                        Confirmer le mot de passe
                    </label>

                    <input
                        type="password"
                        id="confirmation"
                        name="confirmation"
                        placeholder="Confirmez votre mot de passe"
                        required
                        minlength="6"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg
                               focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>


                <!-- BOUTON -->
                <button
                    type="submit"
                    class="w-full bg-[#123f63] text-white font-semibold
                           py-3 rounded-lg hover:bg-[#0d2f4a]
                           transition duration-300">
                    S'inscrire
                </button>

            </form>


            <!-- LIEN CONNEXION -->
            <p class="text-center text-gray-600 mt-6">

                Vous avez déjà un compte ?

                <a href="connexion.html"
                   class="text-blue-600 font-semibold hover:underline">
                    Se connecter
                </a>

            </p>

        </div>

    </main>

</body>
</html>
