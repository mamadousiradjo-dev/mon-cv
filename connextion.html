<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion - Mamadou Siradjo Baldé</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- Menu -->
    <nav class="bg-[#123f63] text-white p-4 mb-8 shadow">
        <div class="flex justify-center items-center gap-6 flex-wrap">

            <a href="index.html"
               class="hover:text-yellow-300 font-medium">
                Accueil
            </a>

            <a href="pages/projets.html"
               class="hover:text-yellow-300 font-medium">
                Projets
            </a>

            <a href="contact.html"
               class="hover:text-yellow-300 font-medium">
                Contact
            </a>

            <a href="connexion.html"
               class="text-yellow-300 font-bold">
                Connexion
            </a>

            <a href="inscription.html"
               class="hover:text-yellow-300 font-medium">
                Inscription
            </a>

        </div>
    </nav>


    <!-- Formulaire de connexion -->
    <main class="flex justify-center px-4 py-8">

        <div class="bg-white w-full max-w-md p-8 rounded-xl shadow-lg">

            <h1 class="text-3xl font-bold text-center text-[#123f63] mb-2">
                CONNEXION
            </h1>

            <p class="text-center text-gray-500 mb-8">
                Connectez-vous à votre compte
            </p>

            <form>

                <!-- Email -->
                <div class="mb-5">

                    <label for="email"
                           class="block text-gray-700 font-medium mb-2">
                        Adresse e-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Entrez votre adresse e-mail"
                        required
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#123f63]"
                    >

                </div>


                <!-- Mot de passe -->
                <div class="mb-6">

                    <label for="password"
                           class="block text-gray-700 font-medium mb-2">
                        Mot de passe
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Entrez votre mot de passe"
                        required
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#123f63]"
                    >

                </div>


                <!-- Bouton -->
                <button
                    type="submit"
                    class="w-full bg-[#123f63] text-white py-3 rounded-lg font-semibold hover:bg-blue-800 transition">
                    Se connecter
                </button>

            </form>


            <!-- Lien inscription -->
            <p class="text-center text-gray-600 mt-6">
                Vous n'avez pas encore de compte ?

                <a href="inscription.html"
                   class="text-[#123f63] font-semibold hover:underline">
                    Créer un compte
                </a>
            </p>

        </div>

    </main>

</body>

</html>
