<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inscription - Mon CV</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-gray-100 font-sans">

    <!-- MENU -->
    <nav class="bg-[#123f63] shadow-lg">
        <div class="max-w-[1000px] mx-auto px-6 py-4">
            <div class="flex justify-center items-center gap-8">

                <a href="../index.html"
                   class="text-white font-bold hover:text-gray-200 transition">
                    Accueil
                </a>

                <a href="projets.html"
                   class="text-white font-bold hover:text-gray-200 transition">
                    Projets
                </a>

                <a href="contact.html"
                   class="text-white font-bold hover:text-gray-200 transition">
                    Contact
                </a>

                <a href="connexion.html"
                   class="text-white font-bold hover:text-gray-200 transition">
                    Connexion
                </a>

                <a href="inscription.html"
                   class="text-white font-bold hover:text-gray-200 transition">
                    Inscription
                </a>

            </div>
        </div>
    </nav>


    <!-- INSCRIPTION -->
    <main class="min-h-[calc(100vh-72px)] flex items-center justify-center px-5 py-10">

        <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8">

            <div class="text-center mb-8">

                <h1 class="text-3xl font-extrabold text-[#123f63]">
                    Créer un compte
                </h1>

                <p class="text-gray-500 mt-2">
                    Inscrivez-vous pour continuer
                </p>

            </div>


            <form>

                <!-- NOM -->
                <div class="mb-5">

                    <label for="nom"
                           class="block text-sm font-semibold text-gray-700 mb-2">
                        Nom complet
                    </label>

                    <input
                        type="text"
                        id="nom"
                        name="nom"
                        placeholder="Entrez votre nom"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#123f63]"
                        required
                    >

                </div>


                <!-- EMAIL -->
                <div class="mb-5">

                    <label for="email"
                           class="block text-sm font-semibold text-gray-700 mb-2">
                        Adresse e-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="exemple@email.com"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#123f63]"
                        required
                    >

                </div>


                <!-- MOT DE PASSE -->
                <div class="mb-5">

                    <label for="password"
                           class="block text-sm font-semibold text-gray-700 mb-2">
                        Mot de passe
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Entrez votre mot de passe"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#123f63]"
                        required
                    >

                </div>


                <!-- CONFIRMATION -->
                <div class="mb-6">

                    <label for="confirm-password"
                           class="block text-sm font-semibold text-gray-700 mb-2">
                        Confirmer le mot de passe
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Confirmez votre mot de passe"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#123f63]"
                        required
                    >

                </div>


                <!-- BOUTON -->
                <button
                    type="submit"
                    class="w-full bg-[#123f63] text-white font-bold py-3 rounded-lg hover:bg-[#0d2f4b] transition">
                    S'inscrire
                </button>

            </form>


            <p class="text-center text-sm text-gray-500 mt-6">

                Vous avez déjà un compte ?

                <a href="connexion.html"
                   class="text-[#123f63] font-bold hover:underline">
                    Se connecter
                </a>

            </p>

        </div>

    </main>

</body>
</html>
