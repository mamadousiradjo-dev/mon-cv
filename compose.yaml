# NE PAS TOUCHER : base MySQL réservée aux tests locaux du CV.
# Ne pas utiliser ces identifiants de démonstration en production.
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_local_test
      MYSQL_DATABASE: mon_cv
      MYSQL_USER: mon_cv
      MYSQL_PASSWORD: mon_cv_local_test
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
